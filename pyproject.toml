[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "alis"
version = "0.1.0"
requires-python = ">=3.9"

[tool.setuptools]
py-modules = ["paths"]

[tool.setuptools.packages.find]
include = ["slr*"]
exclude = ["web*", "Testing_MET*", "docs*", "data*", "models*", "reports*"]